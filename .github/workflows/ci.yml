name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  CACHE_KEY_PREFIX: 'node-modules'

jobs:
  # Fast feedback loop - Unit and Component tests
  unit-and-component-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'clerk/package-lock.json'

      - name: Install dependencies
        working-directory: ./clerk
        run: npm ci

      - name: Run unit tests
        working-directory: ./clerk
        run: npm run test:unit

      - name: Run component tests
        working-directory: ./clerk
        run: npm run test:components

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: clerk/coverage/
          retention-days: 7

  # Integration tests with proper environment setup
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-and-component-tests
    
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/shell || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://localhost:8000
      NEXTAUTH_SECRET: test-secret-for-ci
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'clerk/package-lock.json'

      - name: Install dependencies
        working-directory: ./clerk
        run: npm ci

      - name: Setup test database
        working-directory: ./clerk
        run: npm run setup-db

      - name: Run API tests
        working-directory: ./clerk
        run: npm run test:api

      - name: Run integration tests
        working-directory: ./clerk
        run: npm run test:integration

      - name: Run database tests
        working-directory: ./clerk
        run: npm run test:database

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: clerk/coverage/
          retention-days: 7

  # E2E tests with browser matrix
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        
    env:
      NEXTAUTH_SECRET: test-secret-for-ci
      NEXTAUTH_URL: http://localhost:3000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'clerk/package-lock.json'

      - name: Install dependencies
        working-directory: ./clerk
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./clerk
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        working-directory: ./clerk
        run: npm run build

      - name: Run E2E tests
        working-directory: ./clerk
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-${{ matrix.browser }}
          path: |
            clerk/test-results/
            clerk/playwright-report/
          retention-days: 7

  # Accessibility tests
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: unit-and-component-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'clerk/package-lock.json'

      - name: Install dependencies
        working-directory: ./clerk
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./clerk
        run: npx playwright install --with-deps chromium

      - name: Run accessibility component tests
        working-directory: ./clerk
        run: npm run test:accessibility

      - name: Build application for E2E accessibility tests
        working-directory: ./clerk
        run: npm run build

      - name: Run accessibility E2E tests
        working-directory: ./clerk
        run: npm run test:accessibility:e2e

      - name: Upload accessibility test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-test-results
          path: |
            clerk/coverage/
            clerk/test-results/
          retention-days: 7

  # Performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-and-component-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'clerk/package-lock.json'

      - name: Install dependencies
        working-directory: ./clerk
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./clerk
        run: npx playwright install --with-deps chromium

      - name: Run performance unit tests
        working-directory: ./clerk
        run: npm run test:performance

      - name: Build application for performance tests
        working-directory: ./clerk
        run: npm run build

      - name: Run performance E2E tests
        working-directory: ./clerk
        run: npm run test:performance:e2e

      - name: Run Lighthouse CI
        working-directory: ./clerk
        run: npm run test:performance:lighthouse

      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: |
            clerk/coverage/
            clerk/test-results/
            clerk/.lighthouseci/
          retention-days: 7

  # Test result reporting and notifications
  test-reporting:
    name: Test Results & Notifications
    runs-on: ubuntu-latest
    needs: [unit-and-component-tests, integration-tests, e2e-tests, accessibility-tests, performance-tests]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate test summary report
        run: |
          echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Status" >> $GITHUB_STEP_SUMMARY
          echo "- Unit & Component Tests: ${{ needs.unit-and-component-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility Tests: ${{ needs.accessibility-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Test results and reports are available in the workflow artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const testResults = {
              'Unit & Component': '${{ needs.unit-and-component-tests.result }}',
              'Integration': '${{ needs.integration-tests.result }}',
              'E2E': '${{ needs.e2e-tests.result }}',
              'Accessibility': '${{ needs.accessibility-tests.result }}',
              'Performance': '${{ needs.performance-tests.result }}'
            };
            
            let comment = '## 🧪 Test Results\n\n';
            for (const [testType, result] of Object.entries(testResults)) {
              const emoji = result === 'success' ? '✅' : result === 'failure' ? '❌' : '⚠️';
              comment += `${emoji} **${testType} Tests**: ${result}\n`;
            }
            
            comment += '\n📊 Detailed results are available in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Tests failed - notification logic can be extended here');
            // Add Slack, email, or other notification integrations as needed